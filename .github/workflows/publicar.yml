# Descarga los precios oficiales de los carburantes, regenera la web y la publica en GitHub Pages.
# Funciona solo: no hay que tocar nada. También se ejecuta al cambiar cualquier fichero del repositorio.
name: Actualizar y publicar

on:
  schedule:
    # Cada 3 horas, en minutos poco habituales: GitHub retrasa o se salta a veces las ejecuciones programadas,
    # sobre todo a las horas en punto, y así siempre hay alguna que llega a tiempo.
    - cron: '37 4,7,10,13,16,19 * * *'  # 06:37, 09:37, 12:37, 15:37, 18:37 y 21:37 en verano (una hora menos en invierno)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7


      - name: Descargar los precios de hoy (Ministerio para la Transición Ecológica)
        run: node src/fetch.mjs

      - name: Guardar el histórico en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico.json
          if ! git diff --cached --quiet; then
            git commit -m "Precios de los carburantes $(date -u +%F)"
            git pull --rebase --autostash || true
            git push || echo "::warning::No se pudo guardar el histórico; se reintentará en la próxima ejecución."
          fi

      - name: Generar la web
        run: node src/build.mjs

      - name: Comprobar que no hay nada roto
        run: node tools/check.mjs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  avisar:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Avisar a los buscadores (IndexNow)
        if: github.event_name != 'schedule' || github.event.schedule == '20 5 * * *'
        run: node tools/indexnow.mjs ${{ github.event_name == 'schedule' && 'diario' || 'todo' }}
        continue-on-error: true
      - name: Mantener activa la programación diaria
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publicar.yml/enable" || true
      - name: Comprobar que la web tiene los precios de hoy
        # Si falla, GitHub te envía un correo. La web sigue online con los últimos datos.
        if: github.event_name != 'schedule' || github.event.schedule == '20 11 * * *'
        run: sleep 60 && node tools/estado.mjs
